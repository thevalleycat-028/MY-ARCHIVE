<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的灵感库</title>
  <link rel="manifest" href="./manifest.json?v=2" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192-v2.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon-v2.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f7f5;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ---------- 顶部 ---------- */

    header {
      height: 86px;
      position: relative;
    }

    .add-button {
      border: none;
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      flex: 0 0 auto;
      transition: opacity 0.2s ease;
    }

    .add-button:hover {
      opacity: 0.8;
    }

    .back-button {
      position: fixed;
      top: 29px;
      left: 18px;
      z-index: 6;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      color: #666;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-4px);
      transition:
        opacity 0.2s ease,
        transform 0.35s ease,
        color 0.15s ease;
    }

    .back-button:hover {
      color: #222;
    }

    .back-button:focus-visible {
      outline: 1px solid #999;
      outline-offset: 2px;
    }

    .back-button svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- 搜索 ---------- */

    .search-area {
      height: 16px;
    }

    .search-controls {
      width: min(650px, calc(100vw - 88px));
      position: fixed;
      top: 24px;
      left: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateX(-50%);
      transform-origin: center;
      transition:
        top 0.55s ease,
        width 0.55s ease,
        transform 0.55s ease,
        opacity 0.2s ease;
    }

    .search-form {
      flex: 1 1 auto;
      min-width: 0;
    }

    .search-box {
      width: 100%;
      max-width: none;
      border: none;
      outline: none;
      background: white;
      border-radius: 16px;
      padding: 18px 22px;
      font-size: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    /* ---------- 分类 ---------- */

    .categories {
      padding: 0 40px 30px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .category-button {
      border: 1px solid #ddd;
      background: transparent;
      padding: 8px 14px;
      border-radius: 999px;
      color: #555;
    }

    .category-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    .category-button:hover {
      border-color: #999;
    }

    /* ---------- 内容 ---------- */

    main {
      padding: 0 40px 60px;
      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .empty {
      padding: 100px 20px;
      text-align: center;
      color: #999;
    }

    .inspiration-grid {
      display: flex;
      gap: 20px;
      align-items: start;
    }

    .masonry-column {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card.card-enter {
      animation: card-enter 0.42s ease both;
    }

    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- 首页 / 档案视图 ---------- */

    body.entrance-state .search-controls {
      width: min(680px, calc(100vw - 48px));
      top: 50%;
      transform: translate(-50%, -50%) scale(1.06);
    }

    body.entrance-state .categories,
    body.entrance-state main {
      display: none;
    }

    body.archive-view .back-button {
      opacity: 0.8;
      pointer-events: auto;
      transform: translateX(0);
    }

    body.archive-view .search-controls {
      width: auto;
      left: 56px;
      right: 40px;
      transform: none;
    }

    body.archive-view .search-form {
      flex: 0 1 500px;
      max-width: calc(100vw - 230px);
    }

    body.archive-view .add-button {
      margin-left: auto;
    }

    body.archive-view.is-returning .categories,
    body.archive-view.is-returning main {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
    }

    body.archive-view.is-returning .card {
      opacity: 0;
      transform: translateY(8px);
      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }

    .card-image {
      aspect-ratio: 1 / 1;
      background: #e9e9e6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 13px;
      overflow: hidden;
      position: relative;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .card-image.is-link {
      cursor: pointer;
    }

    .card-content {
      padding: 18px;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.6;
    }

    .card-category {
      flex: 0 0 auto;
      color: #666;
      font-size: 12px;
    }

    .card-meta-separator {
      flex: 0 0 auto;
      color: #bbb;
      margin: 0 6px;
    }

    .card-title {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .tags {
      flex: 1 1 100px;
      min-width: 0;
      color: #999;
      font-size: 12px;
    }

    .tag {
      color: inherit;
    }

    .tag + .tag::before {
      content: " / ";
      color: #bbb;
    }

    .note {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
    }

    .card-actions button {
      border: none;
      background: transparent;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      color: #777;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
      transition: color 0.15s ease, opacity 0.15s ease;
    }

    .card-actions button:hover {
      color: #222;
      opacity: 1;
    }

    .card-actions button:focus-visible {
      outline: 1px solid #999;
      outline-offset: 2px;
      opacity: 1;
    }

    .card-actions .delete-button:hover {
      color: #8a5555;
    }

    .card-actions svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    /* ---------- 弹窗 ---------- */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 20px;
      padding: 28px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      outline: none;
      background: white;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .image-upload {
      width: 100%;
      min-height: 180px;
      border: 1px dashed #d6d6d2;
      border-radius: 10px;
      background: #fafaf8;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .image-upload:hover {
      border-color: #999;
    }

    .image-upload.has-image {
      border-style: solid;
      background: #f1f1ee;
    }

    .image-upload-hint {
      color: #888;
      font-size: 13px;
    }

    .image-preview-image {
      width: 100%;
      height: 100%;
      display: none;
      object-fit: cover;
      object-position: center;
    }

    .image-upload.has-image .image-preview-image {
      display: block;
    }

    .image-upload.has-image .image-upload-hint {
      display: none;
    }

    .image-input {
      display: none;
    }

    .image-upload-note {
      margin-top: 8px;
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .cancel-button,
    .save-button {
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
    }

    .cancel-button {
      background: #f1f1ee;
      color: #555;
    }

    .save-button {
      background: #222;
      color: white;
    }

    .manage-category {
      margin-top: 8px;
      border: none;
      background: transparent;
      color: #777;
      font-size: 12px;
      padding: 0;
    }

    .archive-tools {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }

    .archive-tools button {
      border: none;
      background: transparent;
      color: #999;
      font-size: 12px;
      padding: 4px 0;
    }

    .archive-tools button:hover {
      color: #555;
    }

    .archive-import-input {
      display: none;
    }

    .management-modal-content {
      max-width: 520px;
    }

    .management-section + .management-section {
      border-top: 1px solid #eee;
      margin-top: 22px;
      padding-top: 22px;
    }

    .management-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .management-section-title {
      color: #555;
      font-size: 13px;
    }

    .management-add-button {
      border: none;
      background: transparent;
      color: #777;
      font-size: 12px;
      padding: 4px 0;
    }

    .management-add-button:hover {
      color: #222;
    }

    .management-list {
      border-top: 1px solid #f1f1ee;
    }

    .management-list-item {
      min-height: 38px;
      border-bottom: 1px solid #f1f1ee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 6px 0;
    }

    .management-list-name {
      color: #555;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .management-delete-button {
      flex: 0 0 auto;
      border: none;
      background: transparent;
      width: 28px;
      height: 28px;
      padding: 0;
      color: #777;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.7;
    }

    .management-delete-button:hover {
      color: #8a5555;
      opacity: 1;
    }

    .management-delete-button:focus-visible {
      outline: 1px solid #999;
      outline-offset: 2px;
      opacity: 1;
    }

    .management-delete-button svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .management-empty {
      color: #999;
      font-size: 12px;
      padding: 12px 0;
    }

    /* ---------- 手机 ---------- */

    @media (max-width: 600px) {
      header {
        height: 72px;
      }

      .search-area {
        height: 62px;
      }

      .categories,
      main {
        padding-left: 20px;
        padding-right: 20px;
      }

      .add-button {
        padding: 10px 14px;
      }

      .back-button {
        top: 18px;
        left: 16px;
      }

      .search-controls {
        width: calc(100vw - 40px);
        top: 72px;
      }

      body.entrance-state .search-controls {
        width: calc(100vw - 48px);
        top: 50%;
        transform: translate(-50%, -50%);
      }

      body.archive-view .search-controls {
        left: 52px;
        right: 20px;
      }

      body.archive-view .search-form {
        flex: 1 1 auto;
        max-width: none;
      }

    }
  </style>
</head>

<body class="entrance-state">

  <header>
    <button
      class="back-button"
      type="button"
      aria-label="返回首页"
      title="返回首页"
      onclick="returnToEntrance()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M19 12H5"></path>
        <path d="m12 19-7-7 7-7"></path>
      </svg>
    </button>
  </header>

  <section class="search-area">
    <div class="search-controls">
      <form class="search-form" onsubmit="submitSearch(event)">
        <input
          id="searchInput"
          class="search-box"
          type="text"
          placeholder="搜索我的灵感……"
          oninput="handleSearchInput()"
        />
      </form>
      <button class="add-button" onclick="openModal()">＋ 添加灵感</button>
    </div>
  </section>

  <section class="categories" id="categories"></section>

  <main>
    <div id="inspirationGrid" class="inspiration-grid"></div>
    <div id="emptyState" class="empty">
      Search or browse your archive
    </div>

    <div class="archive-tools" aria-label="档案管理">
      <button type="button" onclick="openManagementModal()">
        管理分类与标签
      </button>
      <button type="button" onclick="triggerArchiveImport()">
        导入档案
      </button>
      <button type="button" onclick="exportArchive()">
        导出档案
      </button>
      <input
        id="archiveImportInput"
        class="archive-import-input"
        type="file"
        accept=".json,application/json"
        onchange="importArchive(event)"
      />
    </div>
  </main>

  <!-- 添加 / 编辑弹窗 -->

  <div id="modal" class="modal">
    <div class="modal-content">

      <div class="modal-title" id="modalTitle">
        添加一条灵感
      </div>

      <div class="form-group">
        <label>标题</label>
        <input id="titleInput" placeholder="例如：花束般的恋爱" />
      </div>

      <div class="form-group">
        <label>链接</label>
        <input id="urlInput" placeholder="https://..." />
      </div>

      <div class="form-group">
        <label>图片</label>

        <label
          id="imageUploadArea"
          class="image-upload"
          for="imageInput"
        >
          <span id="imageUploadHint" class="image-upload-hint">
            点击选择本地图片
          </span>
          <img
            id="imagePreviewImage"
            class="image-preview-image"
            alt="图片预览"
          />
        </label>

        <input
          id="imageInput"
          class="image-input"
          type="file"
          accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
          onchange="handleImageUpload(event)"
        />

        <div class="image-upload-note">
          支持 JPG、JPEG、PNG、WEBP；会自动压缩后保存。
        </div>
      </div>

      <div class="form-group">
        <label>分类</label>

        <select id="categoryInput"></select>

        <button
          class="manage-category"
          onclick="addCategory()"
        >
          ＋ 新建分类
        </button>
      </div>

      <div class="form-group">
        <label>标签</label>
        <input
          id="tagsInput"
          placeholder="用逗号分隔，例如：夏天,色彩,构图"
        />
      </div>

      <div class="form-group">
        <label>为什么喜欢？</label>
        <textarea
          id="noteInput"
          placeholder="记录一下当时为什么想收藏它……"
        ></textarea>
      </div>

      <div class="form-actions">
        <button class="cancel-button" onclick="closeModal()">
          取消
        </button>

        <button class="save-button" onclick="saveInspiration()">
          保存灵感
        </button>
      </div>

    </div>
  </div>

  <!-- 分类与标签管理弹窗 -->

  <div id="managementModal" class="modal">
    <div class="modal-content management-modal-content">

      <div class="modal-title">管理分类与标签</div>

      <section class="management-section">
        <div class="management-section-header">
          <div class="management-section-title">分类</div>
          <button
            class="management-add-button"
            type="button"
            onclick="addCategory()"
          >
            ＋ 新建分类
          </button>
        </div>

        <div id="categoryManagementList" class="management-list"></div>
      </section>

      <section class="management-section">
        <div class="management-section-header">
          <div class="management-section-title">标签</div>
        </div>

        <div id="tagManagementList" class="management-list"></div>
      </section>

      <div class="form-actions">
        <button class="cancel-button" type="button" onclick="closeManagementModal()">
          关闭
        </button>
      </div>

    </div>
  </div>

  <script>

    /* =========================
       数据
    ========================= */

    const defaultCategories = [
      "🎬 电影",
      "📚 书籍",
      "📺 电视剧",
      "🏺 陶瓷",
      "🎨 设计",
      "🎮 游戏"
    ];

    let categories =
      JSON.parse(localStorage.getItem("categories")) ||
      defaultCategories;

    let inspirations =
      JSON.parse(localStorage.getItem("inspirations")) ||
      [];

    inspirations = inspirations.map(item => ({
      ...item,
      image:
        item && typeof item.image === "string"
          ? item.image
          : null
    }));

    let activeCategory = null;

    let isArchiveView = false;

    let shouldAnimateCards = false;

    let returnToEntranceTimer = null;

    let editingId = null;

    let selectedImage = null;

    let masonryResizeTimer = null;

    const MAX_IMAGE_DIMENSION = 1600;
    const TARGET_IMAGE_SIZE = 1024 * 1024;


    /* =========================
       分类
    ========================= */

    function saveCategories() {
      localStorage.setItem(
        "categories",
        JSON.stringify(categories)
      );
    }

    function renderCategories() {

      const container =
        document.getElementById("categories");

      container.innerHTML = "";

      const allButton =
        document.createElement("button");

      allButton.className =
        "category-button " +
        (activeCategory === "全部" ? "active" : "");

      allButton.textContent = "全部";

      allButton.onclick = () => {
        enterArchiveView();
        activeCategory = "全部";
        renderCategories();
        render();
      };

      container.appendChild(allButton);


      categories.forEach(category => {

        const button =
          document.createElement("button");

        button.className =
          "category-button " +
          (activeCategory === category ? "active" : "");

        button.textContent = category;

        button.onclick = () => {
          enterArchiveView();
          activeCategory = category;
          renderCategories();
          render();
        };

        container.appendChild(button);

      });
    }


    /* =========================
       首页 / 档案视图状态
    ========================= */

    function enterArchiveView() {

      if (isArchiveView) return;

      isArchiveView = true;
      shouldAnimateCards = true;

      document.body.classList.remove(
        "entrance-state",
        "is-returning"
      );

      document.body.classList.add("archive-view");

    }


    function submitSearch(event) {

      event.preventDefault();

      const keyword =
        document
          .getElementById("searchInput")
          .value
          .trim();

      if (!keyword && !isArchiveView) return;

      enterArchiveView();
      render();

    }


    function handleSearchInput() {

      if (isArchiveView) {
        render();
      }

    }


    function returnToEntrance() {

      if (
        !isArchiveView ||
        document.body.classList.contains("is-returning")
      ) return;

      document.body.classList.add("is-returning");

      clearTimeout(returnToEntranceTimer);

      returnToEntranceTimer = setTimeout(() => {

        isArchiveView = false;
        shouldAnimateCards = false;
        activeCategory = null;

        document
          .getElementById("searchInput")
          .value = "";

        renderCategories();

        document.body.classList.remove(
          "archive-view",
          "is-returning"
        );

        document.body.classList.add("entrance-state");

        render();

      }, 220);

    }


    /* =========================
       新建分类
    ========================= */

    function addCategory() {

      const name =
        prompt("请输入新的分类名称");

      if (!name || !name.trim()) {
        return;
      }

      categories.push(name.trim());

      saveCategories();

      renderCategories();

      renderCategorySelect();

      renderManagementLists();

      document.getElementById(
        "categoryInput"
      ).value = name.trim();
    }


    /* =========================
       分类下拉菜单
    ========================= */

    function renderCategorySelect() {

      const select =
        document.getElementById("categoryInput");

      select.innerHTML = "";

      categories.forEach(category => {

        const option =
          document.createElement("option");

      });

      const tags = Array.from(usedTags).sort((a, b) =>
        a.localeCompare(b, "zh-CN")
      );

          document.createElement("div");

    function deleteManagedCategory(category) {

      const confirmed = confirm(
        `确定删除分类“${category}”吗？\n\n删除分类不会删除该分类下的灵感，只会移除它们的分类。`
      );

      if (!confirmed) return;

      const updatedCategories =
        categories.filter(item => item !== category);

      const updatedInspirations =
        inspirations.map(item => {

          if (item.category === category) {
            return {
              ...item,
              category: ""
            };
          }

          return item;

        });

      try {
        localStorage.setItem(
          "categories",
          JSON.stringify(updatedCategories)
        );

        localStorage.setItem(
          "inspirations",
          JSON.stringify(updatedInspirations)
        );
      } catch (error) {
        alert("分类删除失败：浏览器本地存储更新失败。");
        return;
      }

      categories = updatedCategories;
      inspirations = updatedInspirations;

      if (activeCategory === category) {
        activeCategory = null;
      }

      renderCategories();
      renderCategorySelect();
      renderManagementLists();
      render();
    }


    function deleteManagedTag(tag) {

      const confirmed = confirm(
        `确定删除标签“${tag}”吗？\n\n删除标签不会删除灵感，只会从使用该标签的灵感中移除这个标签。`
      );

      if (!confirmed) return;

      const updatedInspirations =
        inspirations.map(item => {

          const itemTags =
            Array.isArray(item.tags) ? item.tags : [];

          const hasTag = itemTags.some(itemTag =>
            typeof itemTag === "string" &&
            itemTag.trim() === tag
          );

          if (!hasTag) return item;

          return {
            ...item,
            tags: itemTags.filter(itemTag =>
              !(
                typeof itemTag === "string" &&
                itemTag.trim() === tag
              )
            )
          };

        });

      try {
        localStorage.setItem(
          "inspirations",
          JSON.stringify(updatedInspirations)
        );
      } catch (error) {
        alert("标签删除失败：浏览器本地存储更新失败。");
        return;
      }

      inspirations = updatedInspirations;

      renderManagementLists();
      render();
    }

    function getArchiveDate() {

      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }


    function getStoredArchiveData() {

      const storedInspirations =
        localStorage.getItem("inspirations");

      const storedCategories =
        localStorage.getItem("categories");

      let archiveInspirations = inspirations;
      let archiveCategories = categories;

      try {
        if (storedInspirations) {
          const parsedInspirations =
            JSON.parse(storedInspirations);

          if (Array.isArray(parsedInspirations)) {
            archiveInspirations = parsedInspirations;
          }
        }

        if (storedCategories) {
          const parsedCategories =
            JSON.parse(storedCategories);

          if (Array.isArray(parsedCategories)) {
            archiveCategories = parsedCategories;
          }
        }
      } catch (error) {
        // LocalStorage 中的旧数据异常时，仍使用当前已加载的数据导出。
      }

      return {
        version: 1,
        exportedAt: new Date().toISOString(),
        inspirations: archiveInspirations,
        categories: archiveCategories
      };
    }


    function exportArchive() {

      const archiveData = getStoredArchiveData();

      const archiveBlob = new Blob(
        [JSON.stringify(archiveData, null, 2)],
        { type: "application/json" }
      );

      const downloadUrl = URL.createObjectURL(archiveBlob);

      const downloadLink =
        document.createElement("a");

      downloadLink.href = downloadUrl;
      downloadLink.download =
        `my-archive-${getArchiveDate()}.json`;

      document.body.appendChild(downloadLink);
      downloadLink.click();
      downloadLink.remove();

      window.setTimeout(() => {
        URL.revokeObjectURL(downloadUrl);
      }, 0);
    }

    function readArchiveFile(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(
          new Error("文件读取失败，请重新选择文件。")
        );

        reader.readAsText(file);

      });
    }


    function isValidArchiveItem(item) {

      if (!item || typeof item !== "object" || Array.isArray(item)) {
        return false;
      }

      const hasValidId =
        (typeof item.id === "number" && Number.isFinite(item.id)) ||
        (typeof item.id === "string" && item.id.trim());

      const hasValidTitle =
        typeof item.title === "string";

      const hasValidCategory =
        item.category === undefined ||
        typeof item.category === "string";

      const hasValidTags =
        item.tags === undefined ||
        Array.isArray(item.tags);

      const hasValidNote =
        item.note === undefined ||
        typeof item.note === "string";

      const hasValidImage =
        item.image === undefined ||
        item.image === null ||
        typeof item.image === "string";

      return (
        hasValidId &&
        hasValidTitle &&
        hasValidCategory &&
        hasValidTags &&
        hasValidNote &&
        hasValidImage
      );
    }


    function normalizeImportedInspiration(item) {

      return {
        ...item,
        category:
          typeof item.category === "string"
            ? item.category
            : "",
        tags:
          Array.isArray(item.tags)
            ? item.tags.filter(tag => typeof tag === "string")
            : [],
        note:
          typeof item.note === "string"
            ? item.note
            : "",
        image:
          typeof item.image === "string"
            ? item.image
            : null
      };
    }


    function getImportedArchiveData(parsedData) {

      const isLegacyArray = Array.isArray(parsedData);

      const importedInspirations = isLegacyArray
        ? parsedData
        : parsedData && Array.isArray(parsedData.inspirations)
          ? parsedData.inspirations
          : null;

      if (!importedInspirations) {
        throw new Error(
          "导入失败：未找到有效的灵感档案数据。"
        );
      }

      if (!importedInspirations.every(isValidArchiveItem)) {
        throw new Error(
          "导入失败：档案中包含格式不正确的灵感数据。"
        );
      }

      const importedCategories = isLegacyArray
        ? []
        : parsedData.categories === undefined
          ? []
          : parsedData.categories;

      if (!Array.isArray(importedCategories)) {
        throw new Error(
          "导入失败：档案中的分类数据格式不正确。"
        );
      }

      return {
        inspirations:
          importedInspirations.map(normalizeImportedInspiration),
        categories:
          importedCategories.filter(category =>
            typeof category === "string" && category.trim()
          )
      };
    }


    async function importArchive(event) {

      const file = event.target.files[0];

      if (!file) return;

      const isJsonFile =
        file.name.toLowerCase().endsWith(".json") ||
        file.type === "application/json";

      if (!isJsonFile) {
        alert("请选择 JSON 格式的档案文件。");
        event.target.value = "";
        return;
      }

      try {
        const fileContent = await readArchiveFile(file);
        const parsedData = JSON.parse(fileContent);
        const importedArchive =
          getImportedArchiveData(parsedData);

        const existingIds = new Set(
          inspirations.map(item => String(item.id))
        );

        const newInspirations =
          importedArchive.inspirations.filter(item => {

            const itemId = String(item.id);

            if (existingIds.has(itemId)) {
              return false;
            }

            existingIds.add(itemId);

            return true;

          });

        const mergedInspirations = [
          ...newInspirations,
          ...inspirations
        ];

        const mergedCategories = [...categories];

        importedArchive.categories.forEach(category => {
          if (!mergedCategories.includes(category)) {
            mergedCategories.push(category);
          }
        });

        try {
          localStorage.setItem(
            "inspirations",
            JSON.stringify(mergedInspirations)
          );

          localStorage.setItem(
            "categories",
            JSON.stringify(mergedCategories)
          );
        } catch (error) {
          throw new Error(
            "导入失败：浏览器本地存储空间不足。"
          );
        }

        inspirations = mergedInspirations;
        categories = mergedCategories;

        renderCategories();
        renderCategorySelect();
        render();

        alert(`成功导入 ${newInspirations.length} 条灵感`);

      } catch (error) {
        alert(
          error.message ||
          "导入失败：请选择结构正确的 JSON 档案文件。"
        );
      } finally {
        event.target.value = "";
      }
    }

    function isSupportedImage(file) {

      const supportedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
      ];

      const supportedExtension =
        /\.(jpe?g|png|webp)$/i.test(file.name);

      return supportedTypes.includes(file.type) || supportedExtension;
    }


    function readFileAsDataUrl(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(file);

      });
    }


    function loadImage(dataUrl) {

      return new Promise((resolve, reject) => {

        const image = new Image();

        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error("图片读取失败"));

        image.src = dataUrl;

      });
    }


    function getDataUrlSize(dataUrl) {

      const base64 = dataUrl.split(",")[1] || "";

      return Math.ceil((base64.length * 3) / 4);
    }


    function createCompressedImage(image, width, height, quality) {

      const canvas = document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext("2d");

      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);
      context.drawImage(image, 0, 0, width, height);

      return canvas.toDataURL("image/jpeg", quality);
    }


    async function compressImage(file) {

      const originalDataUrl =
        await readFileAsDataUrl(file);

      const image = await loadImage(originalDataUrl);

      const originalWidth = image.naturalWidth || image.width;
      const originalHeight = image.naturalHeight || image.height;
      const originalMaxDimension = Math.max(
        originalWidth,
        originalHeight
      );

      if (
        file.size <= TARGET_IMAGE_SIZE &&
        originalMaxDimension <= MAX_IMAGE_DIMENSION
      ) {
        return originalDataUrl;
      }

      const scale = Math.min(
        1,
        MAX_IMAGE_DIMENSION / originalMaxDimension
      );

      let width = Math.max(1, Math.round(originalWidth * scale));
      let height = Math.max(1, Math.round(originalHeight * scale));
      let quality = 0.8;
      let compressedImage =
        createCompressedImage(image, width, height, quality);

      while (
        getDataUrlSize(compressedImage) > TARGET_IMAGE_SIZE &&
        quality > 0.55
      ) {
        quality = Number((quality - 0.05).toFixed(2));
        compressedImage =
          createCompressedImage(image, width, height, quality);
      }

      while (
        getDataUrlSize(compressedImage) > TARGET_IMAGE_SIZE &&
        Math.max(width, height) > 800
      ) {
        width = Math.max(1, Math.round(width * 0.85));
        height = Math.max(1, Math.round(height * 0.85));
        quality = 0.8;
        compressedImage =
          createCompressedImage(image, width, height, quality);

        while (
          getDataUrlSize(compressedImage) > TARGET_IMAGE_SIZE &&
          quality > 0.55
        ) {
          quality = Number((quality - 0.05).toFixed(2));
          compressedImage =
            createCompressedImage(image, width, height, quality);
        }
      }

      return compressedImage;
    }


    async function handleImageUpload(event) {

      const file = event.target.files[0];

      if (!file) return;

      if (!isSupportedImage(file)) {
        alert("请选择 JPG、JPEG、PNG 或 WEBP 格式的图片");
        event.target.value = "";
        return;
      }

      try {
        selectedImage = await compressImage(file);
        updateImagePreview();
      } catch (error) {
        alert("图片处理失败，请重新选择一张图片");
      } finally {
        event.target.value = "";
      }
    }

    function getMasonryColumnCount() {

      if (window.innerWidth >= 1200) return 4;
      if (window.innerWidth >= 768) return 3;
      if (window.innerWidth >= 480) return 2;

      return 1;
    }


    function createMasonryColumns(container) {

      const columns = [];
      const columnCount = getMasonryColumnCount();

      for (let index = 0; index < columnCount; index += 1) {

        const column =
          document.createElement("div");

        column.className = "masonry-column";

        container.appendChild(column);
        columns.push(column);

      }

      return columns;
    }


    function getShortestMasonryColumn(columns) {

      return columns.reduce((shortestColumn, column) =>
        column.offsetHeight < shortestColumn.offsetHeight
          ? column
          : shortestColumn
      );
    }

    function render() {

      const grid =
        document.getElementById(
          "inspirationGrid"
        );

      const empty =
        document.getElementById(
          "emptyState"
        );

      const keyword =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();

      const shouldShowArchive =
        isArchiveView;


      grid.innerHTML = "";


      if (!shouldShowArchive) {

        empty.style.display = "none";

        return;

      }


      const filtered =
        inspirations.filter(item => {

          const categoryMatch =
            activeCategory === null ||
            activeCategory === "全部" ||
            item.category === activeCategory;

          const itemTags =
            Array.isArray(item.tags) ? item.tags : [];

          const searchText =
            [
              item.title || "",
              item.category || "",
              item.note || "",
              ...itemTags
            ]
              .join(" ")
              .toLowerCase();

          const searchMatch =
            !keyword ||
            searchText.includes(keyword);

          return categoryMatch && searchMatch;

        });

      if (filtered.length === 0) {

        empty.textContent =
          "No inspirations found.";

        empty.style.display = "block";

        shouldAnimateCards = false;

        return;

      }

      empty.style.display = "none";

      const masonryColumns =
        createMasonryColumns(grid);


      filtered.forEach((item, index) => {

        const card =
          document.createElement("article");

        card.className = "card";


        const itemImage =
          typeof item.image === "string" && item.image
            ? item.image
            : null;

        if (itemImage) {

          const image =
            document.createElement("div");

          image.className = "card-image";

          const imageElement =
            document.createElement("img");

          imageElement.src = itemImage;
          imageElement.alt = item.title || "灵感图片";
          imageElement.loading = "lazy";

          image.appendChild(imageElement);

          if (item.url) {

            image.classList.add("is-link");

            image.onclick = () => {
              window.open(
                item.url,
                "_blank"
              );
            };

          }

          card.appendChild(image);

        }


        const content =
          document.createElement("div");

        content.className =
          "card-content";


        const title =
          document.createElement("div");

        title.className =
          "card-title";

        title.textContent =
          item.title;


        const itemTags =
          Array.isArray(item.tags)
            ? item.tags.filter(tag =>
              typeof tag === "string" && tag.trim()
            )
            : [];

        const categoryName =
          typeof item.category === "string"
            ? item.category.trim()
            : "";

        let meta = null;

        if (categoryName || itemTags.length) {

          meta = document.createElement("div");
          meta.className = "card-meta";

          if (categoryName) {

            const category =
              document.createElement("span");

            category.className = "card-category";
            category.textContent = categoryName;

            meta.appendChild(category);

          }

          if (categoryName && itemTags.length) {

            const separator =
              document.createElement("span");

            separator.className = "card-meta-separator";
            separator.textContent = "·";

            meta.appendChild(separator);

          }

          if (itemTags.length) {

            const tags =
              document.createElement("span");

            tags.className = "tags";

            itemTags.forEach(tag => {

              const tagElement =
                document.createElement("span");

              tagElement.className = "tag";
              tagElement.textContent = tag.trim();

              tags.appendChild(tagElement);

            });

            meta.appendChild(tags);

          }

        }


        const noteText =
          typeof item.note === "string"
            ? item.note.trim()
            : "";


        const actions =
          document.createElement("div");

        actions.className =
          "card-actions";


        const editButton =
          document.createElement("button");

        editButton.type = "button";
        editButton.className = "edit-button";
        editButton.setAttribute("aria-label", "编辑");
        editButton.title = "编辑";
        editButton.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
          </svg>
        `;

        editButton.onclick = () =>
          openModal(item.id);


        const deleteButton =
          document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className = "delete-button";
        deleteButton.setAttribute("aria-label", "删除");
        deleteButton.title = "删除";
        deleteButton.innerHTML = `
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 6h18"></path>
            <path d="M8 6V4h8v2"></path>
            <path d="m19 6-1 14H6L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
        `;

        deleteButton.onclick = () =>
          deleteInspiration(item.id);


        actions.appendChild(
          editButton
        );

        actions.appendChild(
          deleteButton
        );


        if (meta) {
          content.appendChild(meta);
        }

        content.appendChild(title);

        if (noteText) {

          const note =
            document.createElement("div");

          note.className =
            "note";

          note.textContent = noteText;

          content.appendChild(note);

        }

        content.appendChild(actions);

        card.appendChild(content);

        if (shouldAnimateCards) {
          card.classList.add("card-enter");
          card.style.animationDelay =
            `${Math.min(index, 10) * 40}ms`;
        }

        getShortestMasonryColumn(masonryColumns)
          .appendChild(card);

      });

      shouldAnimateCards = false;

    }


    /* =========================
       初始化
    ========================= */

    renderCategories();

    renderCategorySelect();

    window.addEventListener("resize", () => {

      window.clearTimeout(masonryResizeTimer);

      masonryResizeTimer = window.setTimeout(() => {
        render();
      }, 150);

    });

  </script>

</body>
</html>
